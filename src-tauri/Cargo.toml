[package]
name = "matindesk"
version = "1.0.0"
description = "MatinDesk — personal workspace: tasks, notes, finance, calendar, accurate stats"
authors = ["MatinDesk"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
